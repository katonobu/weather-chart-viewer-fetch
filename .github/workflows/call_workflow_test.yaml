name: Debug for calling workflow

on:
  schedule:
    - cron: '*/5 * * * *' # 5分毎
    
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deploy stage'
        required: true
        default: 'prd'
        type: choice
        options:
          - dev
          - stg
          - prd    

jobs:
  build_and_deploy_app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Dummy step (schedule を有効化するため)
        run: echo "schedule enabled"

      - name: Call reusable workflow
        uses: katonobu/weather-chart-viewer-astro-sidey/.github/workflows/build_and_deploy.yaml@main
        with:
          stage: ${{ github.event_name == 'schedule' && 'prd' || github.event.inputs.stage }}

