name: Run get_short_range_prediction_and_deploy

on:
  schedule:
    - cron: '0 19 * * *' # 日本時間 4:00 (UTC 19:00)
    - cron: '0 7 * * *'  # 日本時間 16:00 (UTC 7:00)

  workflow_dispatch:
    inputs:
      stage:
        description: 'Deploy stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  SERVICE: weatherchart
  AWS_REGION: ap-northeast-1

jobs:
  fetch_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDCトークン発行に必要
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Set timestamp
        run: echo "FETCH_DATE_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run Python script
        run: python -m scraper.jobs.get_short_range_prediction

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: short-range-output_${{ env.FETCH_DATE_TIME }}
          path: scraper/data/**/*
          retention-days: 15

      - name: Configure AWS credentials for contents update
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::382736933734:role/weatherchart-contents-deploy-role          
          aws-region: ap-northeast-1

      - name: Upload artifacts to S3
        run: aws s3 cp scraper/data/ s3://frontend-cmn-weatherchart-content/shared/services/weatherchart/ --recursive

      - name: Generate directory list JSON (Python)
        env:
            BUCKET: frontend-cmn-weatherchart-content
            PREFIX: shared/services/weatherchart/
        run: |
            python util/generate_directory_list.py

      - name: Upload directory_list.json
        run: |
            aws s3 cp directory_list.json \
            s3://frontend-cmn-weatherchart-content/shared/services/weatherchart/directory_list.json

      - name: Configure AWS credentials for cache invalidate dev
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::357665575661:role/weatherchartInvalidateGitHubRole
          aws-region: ap-northeast-1

      - name: Invalidate CloudFront dev
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3KCZCB6BTKPI9 \
            --paths "/shared/services/weatherchart/directory_list.json"

      - name: Configure AWS credentials for cache invalidate dev
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::108241940789:role/weatherchartInvalidateGitHubRole
          aws-region: ap-northeast-1

      - name: Invalidate CloudFront stg
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2DYA9BWGLHDV7 \
            --paths "/shared/services/weatherchart/directory_list.json"

      - name: Configure AWS credentials for cache invalidate stg
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::179698341762:role/weatherchartInvalidateGitHubRole
          aws-region: ap-northeast-1

      - name: Invalidate CloudFront prd
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3W1M78O72OP78 \
            --paths "/shared/services/weatherchart/directory_list.json"


  build_and_deploy:
    needs: fetch_and_deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set STAGE
        run: |
          echo "github.event_name:${{ github.event_name }}"
          echo "github.event.inputs.stage:${{github.event.inputs.stage}}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "STAGE=dev" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "STAGE=${{ github.event.inputs.stage }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "STAGE=prd >> $GITHUB_ENV
          else
            echo "----- unexpected pattern -----"
            echo "STAGE=dev" >> $GITHUB_ENV
          fi

      - name: Display service,STAGE
        run: |
          # 環境変数の表示
          echo "Service: ${{ env.SERVICE }}"
          echo "STAGE: ${{ env.STAGE }}"

      - name: Checkout Astro Sidey Web - app
        uses: actions/checkout@v4
        with:
          repository: katonobu/weather-chart-viewer-astro-sidey
          ref: main
          path: astro-sidey

      - name: Build Astro
        working-directory: astro-sidey
        run: |
          npm install
          NEW_ENTRY_ID=ALL npm run build-${{ env.STAGE }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE }}-${{ env.STAGE }}
          path: astro-sidey/dist
          retention-days: 15          

      # =========================
      # stageごとの設定切替
      # =========================
      - name: Set stage config
        id: stage
        run: |
          echo "STAGE=$STAGE" >> $GITHUB_ENV

          if [ "$STAGE" = "prd" ]; then
            echo "ACCOUNT_ID=179698341762" >> $GITHUB_ENV
            echo "DIST_ID=E3W1M78O72OP78" >> $GITHUB_ENV
          elif [ "$STAGE" = "stg" ]; then
            echo "ACCOUNT_ID=108241940789" >> $GITHUB_ENV
            echo "DIST_ID=E2DYA9BWGLHDV7" >> $GITHUB_ENV
          else
            echo "ACCOUNT_ID=357665575661" >> $GITHUB_ENV
            echo "DIST_ID=E3KCZCB6BTKPI9" >> $GITHUB_ENV
          fi

      # =========================
      # AWS認証（OIDC）
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.SERVICE }}CodeGitHubRole

      # =========================
      # S3 deploy
      # =========================
      - name: Deploy to S3
        run: |
          aws s3 cp astro-sidey/dist s3://frontend-${{ env.STAGE }}-${{ env.SERVICE }}-site/ --recursive

      # =========================
      # CloudFront invalidate
      # =========================
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DIST_ID }} \
            --paths "/*" "/recent/*" "/archive/*" "/view/*" "/details/*"
